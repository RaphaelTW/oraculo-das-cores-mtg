<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" class="portal-illustration" role="img" aria-labelledby="art-title" focusable="false">
<title id="art-title">Viajante de planos sob um eclipse místico</title>
<defs>
<pattern id="portal-dots" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#111512" opacity=".18"/></pattern>
<clipPath id="portal-clip"><rect width="680" height="760"/></clipPath>
</defs><style>
.portal-orbit{transform-box:view-box;transform-origin:358px 288px}
.portal-orbit-outer{animation:orbitClockwise 46s linear infinite}
.portal-orbit-middle{animation:orbitCounter 28s linear infinite}
.portal-orbit-inner{animation:orbitClockwise 17s linear infinite}
.portal-heart{transform-box:view-box;transform-origin:358px 288px;animation:heartPulse 4s ease-in-out infinite}
@keyframes orbitClockwise{to{transform:rotate(360deg)}}
@keyframes orbitCounter{to{transform:rotate(-360deg)}}
@keyframes heartPulse{50%{opacity:.74;transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.portal-orbit,.portal-heart{animation:none!important}}
</style>
<g clip-path="url(#portal-clip)">
<rect width="680" height="760" fill="#d9d4c7"/>
<rect x="0" y="0" width="680" height="760" fill="url(#portal-dots)"/>
<path d="M0 0H680V94L638 122 560 84 504 120 432 57 319 95 225 61 144 119 52 91 0 118Z" fill="#b6b9a9"/>
<path d="M0 0H680V26H0Z" fill="#171b18"/>
<!-- Multi-ring astronomical mechanism. Each layer rotates independently. -->
<g class="portal-structure" aria-hidden="true">
  <circle cx="358" cy="288" r="205" fill="#181e1b"/>
  <circle cx="358" cy="288" r="187" fill="#d9d4c7"/>
  <circle cx="358" cy="288" r="161" fill="#202a24"/>
  <circle cx="358" cy="288" r="144" fill="#0b130f"/>
  <circle cx="358" cy="288" r="119" fill="#7f8b73"/>
  <circle cx="358" cy="288" r="91" fill="#c0c8b6"/>
  <circle cx="358" cy="288" r="69" fill="#1a201a"/>
</g>
<!-- SLOW / clockwise, gemstones travel on the outer orbital circumference. -->
<g class="portal-orbit portal-orbit-outer" aria-hidden="true">
 <circle cx="358" cy="288" r="234" stroke="#151b17" stroke-width="2.5" fill="none" stroke-dasharray="1.5 7.6" opacity=".9" />
 <circle cx="358" cy="288" r="204" stroke="#9eae91" stroke-width="3" fill="none" stroke-dasharray="41 118 16 88" opacity=".75"/>
 <path d="m358 121 12-21-12-20-12 20Z" fill="#b3d36a" />
 <path d="M523 289l20-12 20 12-20 12Z" fill="#84aecb" />
 <path d="m358 455 12 20-12 21-12-21Z" fill="#c07b61" />
 <path d="M193 289l-21-12-20 12 20 12Z" fill="#bca8d0" />
 <circle cx="472" cy="175" r="6" fill="#e8e0c4" />
 <circle cx="244" cy="401" r="4" fill="#c6d4b9" />
</g>
<!-- MEDIUM / counter-clockwise. Uneven engraved graduations make the motion visible. -->
<g class="portal-orbit portal-orbit-middle" aria-hidden="true">
 <circle cx="358" cy="288" r="153" stroke="#dde4d0" stroke-width="2" fill="none" stroke-dasharray="7 13 2 22 31 16" stroke-opacity=".6"/>
 <path d="M358 134v27M358 415v27M205 288h27M484 288h27" stroke="#d2dac4" stroke-width="3" stroke-opacity=".7" />
 <path d="M248 178 266 196M468 178 450 196M248 398l18-18M468 398l-18-18" stroke="#d2dac4" stroke-width="1.8" stroke-opacity=".65" />
 <circle cx="358" cy="135" r="4" fill="#b6d870"/>
 <path d="M358 139 A149 149 0 0 1 490 220" stroke="#b5d36b" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6" />
</g>
<!-- FAST / clockwise fine astrolabe disk. -->
<g class="portal-orbit portal-orbit-inner" aria-hidden="true">
 <path d="M358 186v204M256 288h204M286 216l144 144M430 216 286 360" stroke="#d5dbc9" stroke-width="1.3" stroke-opacity=".32"/>
 <circle cx="358" cy="288" r="81" stroke="#e2ead5" stroke-width="1.7" fill="none" stroke-dasharray="14 26 3 17" stroke-opacity=".58" />
 <path d="M358 215v13M358 348v13M285 288h13M418 288h13" stroke="#b4d978" stroke-width="3" stroke-linecap="square"/>
</g>
<g class="portal-heart" aria-hidden="true"><circle cx="358" cy="288" r="22" fill="#9fd15b" /></g>
<!-- ruins and silhouettes -->
<path d="M0 408 74 350 127 409 191 371 239 435 314 392 383 450 458 392 529 434 605 363 680 420V760H0Z" fill="#a5aaa1"/>
<path d="M0 440 49 386 72 389 90 423 148 387 169 430 211 412 258 454 310 428 345 465 385 419 452 466 498 410 542 437 611 398 680 450V760H0Z" fill="#728075"/>
<!-- cathedral pillars -->
<path d="M8 450h56V303l-18-31-17 31v147Z" fill="#26352c"/>
<path d="M28 312h16v83H28Z" fill="#d9d4c7" opacity=".23"/>
<path d="M110 461h39V346l-20-36-19 36Z" fill="#26352c"/>
<path d="M568 466h47V309l-23-40-24 40Z" fill="#26352c"/>
<path d="M631 450h49V326l-25-40-24 40Z" fill="#26352c"/>
<path d="M585 315v103" stroke="#b7c0ac" stroke-width="5"/>
<path d="M647 335v75" stroke="#b7c0ac" stroke-width="4"/>
<!-- fractured bridge -->
<path d="M0 561 198 533 251 543 315 530 404 545 497 518 680 539V760H0Z" fill="#243128"/>
<path d="M0 569 198 538 251 550 310 537 404 551 497 527 680 547" fill="none" stroke="#b9c1a2" stroke-width="10"/>
<path d="M209 538l-20 75-55 27M318 538l-20 100-46 26M497 526l20 99 45 27" fill="none" stroke="#111713" stroke-width="17"/>
<path d="M0 639 70 622 149 651 222 613 302 642 385 612 468 650 554 600 680 631V760H0Z" fill="#151d17"/>
<path d="M0 697 91 651 168 700 240 669 339 693 413 669 506 710 587 651 680 698V760H0Z" fill="#0c1410"/>
<!-- lone traveler silhouette -->
<path d="M329 467q9-16 22-1l6 28-8 13-22-12Z" fill="#0c120f"/>
<path d="M321 487 355 493 378 590 350 568 344 628 311 637 317 564 292 601Z" fill="#0c120f"/>
<path d="M320 501 307 548 290 561" fill="none" stroke="#0c120f" stroke-width="12" stroke-linecap="round"/>
<path d="M352 511 390 545" fill="none" stroke="#0c120f" stroke-width="12" stroke-linecap="round"/>
<path d="M391 442v176" stroke="#151a14" stroke-width="8"/>
<path d="m392 427-15 21 15 12 15-12Z" fill="#aad46a" stroke="#151a14" stroke-width="3"/>
<path d="M306 634 298 674M339 629l14 51" stroke="#0c120f" stroke-width="12" stroke-linecap="square"/>
<!-- foreground framing graphic lines -->
<path d="M26 41V727H650V41" fill="none" stroke="#111713" stroke-opacity=".45" stroke-width="2"/>
<path d="M46 725h113M520 725h110" stroke="#a5c85a" stroke-width="6"/>
<path d="M26 109h47M603 109h47" stroke="#111713" stroke-width="2"/>
</g>
</svg>
